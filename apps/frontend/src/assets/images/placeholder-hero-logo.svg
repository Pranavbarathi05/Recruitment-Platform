<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Hero Logo Placeholder - Larger version for landing page -->
  <rect width="300" height="300" fill="transparent"/>
  
  <!-- DSC Logo - Styled brackets -->
  <g transform="translate(50, 100)">
    <!-- Red bracket < | -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="#EA4335">&lt;|</text>
    <!-- Blue bracket ) -->
    <text x="70" y="80" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="#4285F4">)</text>
    <!-- Yellow 5 -->
    <text x="110" y="80" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="#FBBC05">5</text>
    <!-- Green { -->
    <text x="160" y="80" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="#34A853">{</text>
  </g>
</svg>
