<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>fullscreen probe</title></head>
  <body>
    <button id="b" style="font-size:24px;padding:16px">enter fullscreen</button>
    <pre id="out">idle</pre>
    <script>
      const out = document.getElementById('out');
      const log = [];
      const show = () => { out.textContent = JSON.stringify({ log, fullscreenElement: document.fullscreenElement ? document.fullscreenElement.tagName : null, enabled: document.fullscreenEnabled }); };
      document.getElementById('b').onclick = () => {
        log.push('called');
        let p;
        try { p = document.documentElement.requestFullscreen(); } catch (e) { log.push('threw:' + e.name); show(); return; }
        p.then(() => { log.push('resolved:' + (document.fullscreenElement ? document.fullscreenElement.tagName : 'null')); show(); },
               (e) => { log.push('rejected:' + e.name + ' ' + e.message); show(); });
        setTimeout(() => { log.push('t+1000:' + (document.fullscreenElement ? document.fullscreenElement.tagName : 'null')); show(); }, 1000);
      };
      document.addEventListener('fullscreenchange', () => { log.push('event:' + (document.fullscreenElement ? document.fullscreenElement.tagName : 'null')); show(); });
      show();
    </script>
  </body>
</html>
